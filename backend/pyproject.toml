[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consolidador-lm-backend"
version = "0.1.0"
description = "API para consolidacao segura de fontes de codigo para LLMs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pathspec>=0.12,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]